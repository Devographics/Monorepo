- id: workplace
  path: /workplace
  blocks:
      - template: page_introduction

      - id: figure_yearly_salary_usa_world
        template: figure
        variables:
            value: 105000
            unit: usd

      - id: yearly_salary
        template: multiple_options2
        variants:
            - id: country_vs_yearly_salary
              template: vs_facet
              fieldId: country
              queryOptions:
                  sectionId: user_info
              tabId: tabs.by_country
              parameters:
                  limit: 20
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: yearly_salary_us_vs_world
              fieldId: yearly_salary
              tabId: tabs.usa_vs_the_world
              template: vs_facet
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: in
                              value: [USA]
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: nin
                              value: [USA]

      - id: income_evolution
        template: single_option2
        variants:
            - id: income_evolution_vs_country
              template: vs_facet
              tabId: tabs.by_country
              queryOptions:
                  sectionId: user_info
              fieldId: country
              parameters:
                  limit: 30
              chartOptions:
                  limit: 10
              filtersState:
                  options:
                      mode: facet
                      sort: increased
                      order: desc
                  facet:
                      sectionId: workplace
                      id: income_evolution

      - id: figure_company_size_income_evolution
        template: figure
        variables:
            value: 62
            unit: percentage

      - id: company_size
        template: multiple_options2
        variants:
            - template: vs_salary
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: company_size_vs_income_evolution
              template: vs_facet
              filtersState:
