              filtersState:
                  facet:
                      sectionId: workplace
                      id: work_areas
            - id: yearly_income_developers_engineers
              template: vs_facet
              tabId: tabs.developers_engineers
              queryOptions:
                  sectionId: workplace
              fieldId: yearly_salary
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: job_title
                              sectionId: workplace
                              operator: in
                              value:
                                  - developer
                                  - frontend_developer
                                  - senior_developer
                                  - fullstack_developer
                                  - lead_developer
                      - conditions:
                            - fieldId: job_title
                              sectionId: workplace
