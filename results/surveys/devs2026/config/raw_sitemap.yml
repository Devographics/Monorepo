- id: introduction
  path: /
  showTitle: false
  blocks:
      # - id: survey_livestream
      #   blockType: LivestreamBlock
      #   disableExport: true
      #   wrapBlock: false
      - id: survey_intro
        blockType: SurveyIntroBlock
        disableExport: true
        wrapBlock: false
      - id: survey_credits
        template: credits
      - id: survey_newsletter
        blockType: NewsletterBlock
        disableExport: true
        wrapBlock: false
      - id: survey_sponsors
        template: sponsors
      - id: survey_partners
        template: sponsors
        blockType: PartnersBlock
      - id: survey_translators
        blockType: TranslatorsBlock
        disableExport: true
        wrapBlock: false

- id: user_info
  titleId: sections.demographics.title
  path: /demographics
  blocks:
      - template: page_introduction

      - id: country
        template: multiple_options2
        parameters: { limit: 40 }
        chartOptions:
            limit: 10
            cutoff: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters:
                  limit: 40
                  cutoff: 20
                  sort: { property: medianByFacet, order: desc }
              chartOptions:
                  limit: 20
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: country_of_origin
        template: multiple_options2
        parameters: { limit: 40 }
        i18nNamespace: country # (options namespace)
        chartOptions:
            limit: 10
            cutoff: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters:
                  limit: 40
                  cutoff: 20
                  sort: { property: medianByFacet, order: desc }
              chartOptions:
                  limit: 20
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: migration_experience
        template: multiple_options2_combined
        parameters: { limit: 40 }
        chartOptions:
            limit: 20
            cutoff: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters:
                  limit: 40
                  cutoff: 20
                  sort: { property: medianByFacet, order: desc }
              chartOptions:
                  limit: 20
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
      #   - id: hint_hint
      #     template: hint

      - id: native_languages
        template: multiple_options2_freeform
        parameters: { limit: 40 }
        chartOptions:
            limit: 20
            cutoff: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters:
                  limit: 40
                  cutoff: 20
                  sort: { property: medianByFacet, order: desc }
              chartOptions:
                  limit: 20
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: other_languages
        template: multiple_options2_freeform
        parameters: { limit: 40 }
        chartOptions:
            limit: 20
            cutoff: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters:
                  limit: 40
                  cutoff: 20
                  sort: { property: medianByFacet, order: desc }
              chartOptions:
                  limit: 20
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: figure_gender
        template: figure
        variables:
            value: 18
            unit: percentage

      - id: gender
        template: multiple_options2
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - template: vs_salary
              id: gender_vs_salary_experience_fixed
              tabId: tabs.by_salary_experience_fixed
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  filters:
                      - year: 2025
                        conditions:
                            - fieldId: years_of_experience
                              sectionId: career
                              operator: eq
                              value: range_10_14
                      - year: 2025
                        conditions:
                            - fieldId: years_of_experience
                              sectionId: career
                              operator: eq
                              value: range_10_14
                  facet:
                      sectionId: workplace
                      id: yearly_salary

            - id: country_vs_gender
              fieldId: country
              tabId: tabs.by_country
              template: multiple_options2
              parameters:
                  showNoAnswer: true
                  limit: 20
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender
            - template: vs_years_of_experience
              filtersState:
                  facet:
                      sectionId: career
                      id: years_of_experience
              parameters:
                  sort: { property: medianByFacet }
            # - template: vs_age
            #   filtersState:
            #       facet:
            #           sectionId: health
            #           id: age

      - id: sexual_orientation
        template: multiple_options2
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - template: vs_salary
              id: sexual_orientation_vs_salary_experience_fixed
              tabId: tabs.by_salary_experience_fixed
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  filters:
                      - year: 2025
                        conditions:
                            - fieldId: years_of_experience
                              sectionId: career
                              operator: eq
                              value: range_10_14
                      - year: 2025
                        conditions:
                            - fieldId: years_of_experience
                              sectionId: career
                              operator: eq
                              value: range_10_14
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: race_ethnicity
        template: multiple_options2_combined
        takeaway: >
            The survey's non-white population tended to be younger and have less experience, confirming a trend first observed in other surveys. This might indicate that the next generation of front end developers will be more diverse than the current one.
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - template: vs_gender
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender
            - template: vs_years_of_experience
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: career
                      id: years_of_experience
            - template: vs_age
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: health
                      id: age

      - id: relationship_status
        template: multiple_options2_combined
        parameters:
            sort: { property: count }
        variants:
            - id: age_vs_relationship_status
              queryOptions:
                  sectionId: health
              fieldId: age
              tabId: tabs.by_age
              template: multiple_options2
              filtersState:
                  facet:
                      sectionId: user_info
                      id: relationship_status
            - id: country_vs_relationship_status
              fieldId: country
              tabId: tabs.by_country
              template: multiple_options2
              parameters:
                  showNoAnswer: true
                  limit: 20
              filtersState:
                  options:
                      mode: facet
                      sort: single
                      order: desc
                  facet:
                      sectionId: user_info
                      id: relationship_status
            - id: gender_vs_relationship_status
              fieldId: gender
              tabId: tabs.by_gender
              template: multiple_options2
              parameters:
                  showNoAnswer: true
                  limit: 20
              filtersState:
                  options:
                      mode: facet
                      sort: single
                      order: desc
                  facet:
                      sectionId: user_info
                      id: relationship_status

      - id: number_of_kids
        template: single_option2
        variants:
            - template: vs_age
              filtersState:
                  facet:
                      sectionId: health
                      id: age
            - id: gender_vs_number_of_kids
              tabId: tabs.by_gender
              template: vs_facet
              fieldId: gender
              defaultView: average
              filtersState:
                  facet:
                      sectionId: user_info
                      id: number_of_kids

