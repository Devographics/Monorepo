- id: workplace
  path: /workplace
  blocks:
      - template: page_introduction

      - id: figure_company_size_income_evolution
        template: figure
        variables:
            value: 66
            unit: percentage

      - id: company_size
        template: multiple_options2
        variants:
            - template: vs_salary
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: company_size_vs_income_evolution
              template: vs_facet
              filtersState:
                  facet:
                      sectionId: workplace
                      id: income_evolution

      - id: figure_job_title_income
        template: figure
        variables:
            value: 44939
            unit: usd

      - id: job_title
        template: multiple_options2_freeform
        variants:
            - template: vs_salary
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - template: vs_years_of_experience
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  facet:
                      sectionId: career
                      id: years_of_experience
            - template: vs_gender
              parameters:
                  limit: 20
                  cutoff: 100
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender
            - id: yearly_income_developers_engineers
              template: vs_facet
              tabId: tabs.developers_engineers
              queryOptions:
                  sectionId: workplace
              fieldId: yearly_salary
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: job_title
                              sectionId: workplace
                              operator: in
                              value:
                                  - developer
                                  - frontend_developer
                                  - senior_developer
                                  - fullstack_developer
                                  - lead_developer
                      - conditions:
                            - fieldId: job_title
                              sectionId: workplace
                              operator: in
                              value:
                                  - software_engineer
                                  - senior_engineer
                                  - frontend_engineer
                                  - lead_engineer
                                  - director_of_engineering
                                  - fullstack_engineer
                                  - engineering_manager

      - id: work_areas
        template: multiple_options2
        variants:
            - template: vs_salary
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - template: vs_years_of_experience
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  facet:
                      sectionId: career
                      id: years_of_experience
            - template: vs_gender
              parameters:
                  limit: 20
                  cutoff: 100
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender

      - id: frontend_masters_learning_path
        template: midpage_resource
        variables:
            id: fem-learning-path
            labelId: frontendmasters.learning_path
            imageUrl: https://assets.devographics.com/sponsors/fem-background-intermediate.jpg
            logoUrl: https://assets.devographics.com/sponsors/frontend-masters-dark.png
            link: https://frontendmasters.com/learn/professional/?utm_source=stateofdevs&utm_medium=website&utm_campaign=devs2025

      - id: figure_yearly_salary_usa_world
        template: figure
        variables:
            value: 70332
            unit: usd

      - id: yearly_salary
        template: multiple_options2
        variants:
            - id: country_vs_yearly_salary
              template: vs_facet
              fieldId: country
              queryOptions:
                  sectionId: user_info
              tabId: tabs.by_country
              parameters:
                  limit: 20
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: yearly_salary_us_vs_world
              fieldId: yearly_salary
              tabId: tabs.usa_vs_the_world
              template: vs_facet
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: in
                              value: [USA]
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: nin
                              value: [USA]

      - id: income_evolution
        template: single_option2
        variants:
            - id: income_evolution_vs_country
              template: vs_facet
              tabId: tabs.by_country
              queryOptions:
                  sectionId: user_info
              fieldId: country
              parameters:
                  limit: 30
              chartOptions:
                  limit: 10
              filtersState:
                  options:
                      mode: facet
                      sort: increased
                      order: desc
                  facet:
                      sectionId: workplace
                      id: income_evolution

      - id: figure_job_finding_application_count
        template: figure
        variables:
            value: 4
            unit: count

      - id: job_finding_application_count
        template: single_option2
        variants:
            - id: years_of_experience_vs_job_finding_application_count
              template: vs_facet
              tabId: tabs.by_experience
              queryOptions:
                  sectionId: career
              fieldId: years_of_experience
              filtersState:
                  options:
                      mode: facet
                  facet:
                      sectionId: workplace
                      id: job_finding_application_count

      - id: job_finding_methods
        template: multiple_options2_combined
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary

      - id: figure_remote_work_policy_happiness
        template: figure
        variables:
            value: 0.7
            unit: count

      - id: remote_work_policy
        template: single_option2
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: job_happiness_by_remote_work_policy
              tabId: tabs.vs_job_happiness
              template: vs_facet
              queryOptions:
                  sectionId: workplace
              fieldId: job_happiness
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: remote_work_policy
                              sectionId: workplace
                              operator: in
                              value: [no_remote_work]
                      - conditions:
                            - fieldId: remote_work_policy
                              sectionId: workplace
                              operator: nin
                              value: [no_remote_work]

      - id: work_hours_per_week
        template: single_option2
        variants:
            - template: vs_salary
              filtersState:
                  facet:
                      sectionId: workplace
                      id: yearly_salary
            - id: work_hours_per_week_per_country
              queryOptions:
                  sectionId: user_info
              fieldId: country
              tabId: tabs.by_country
              template: multiple_options2
              parameters:
                  showNoAnswer: true
                  limit: 20
                  sort: { property: medianByFacet }
                  cutoff: 100
              filtersState:
                  options:
                      mode: facet
                  facet:
                      sectionId: workplace
                      id: work_hours_per_week

      - id: job_happiness
        template: single_option2
        variants:
            - id: job_happiness_vs_years_of_experience
              queryOptions:
                  sectionId: career
              fieldId: years_of_experience
              template: vs_facet
              tabId: tabs.by_experience
              filtersState:
                  facet:
                      sectionId: workplace
                      id: job_happiness

      - id: workplace_perks
        template: multiple_options2_combined

      - id: workplace_difficulties
        template: multiple_options2_combined

      - id: workplace_burnout
        template: multiple_options2_combined

      - id: keyboard
        template: multiple_options2_freeform
        queryOptions:
            addBucketsEntities: true
            addGroupedBuckets: false
            addNestedBuckets: true
        hideOtherAnswersBucket: true

      - id: monitors
        template: single_option2

- id: ai_usage
  path: /ai
  blocks:
      - template: page_introduction

      - id: ai_generated_code_balance
        template: single_option2

      - id: ai_sentiment
