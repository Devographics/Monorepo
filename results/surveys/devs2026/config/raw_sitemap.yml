              filtersState:
                  facet:
                      sectionId: ai_usage
                      id: ai_generated_code_balance

      - id: figure_job_title_income
        template: figure
        variables:
            value: 65000
            unit: usd

      - id: job_title
        template: multiple_options2_freeform
        variants:
