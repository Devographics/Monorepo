- id: user_info
  titleId: sections.demographics.title
  path: /demographics
  blocks:
      - template: page_introduction

      - id: country
        template: multiple_options2
        parameters: { limit: 40 }
        chartOptions:
            limit: 20
        queryOptions:
            addBucketsEntities: false
        variants:
            - template: vs_salary
              parameters: { limit: 40, sort: { property: medianByFacet, order: desc } }
              chartOptions:
                  limit: 20

      - id: hint_hint
        template: hint

      - id: age
        template: multiple_options2
        variants:
            - template: vs_salary
            - template: vs_gender

      - id: years_of_experience
        template: multiple_options2
        variants:
            - template: vs_salary
            - template: vs_gender

      - id: company_size
        template: multiple_options2
        variants:
            - template: vs_salary

      - id: variants_hint
        template: hint

      - id: yearly_salary
        template: multiple_options2
        variants:
            - id: yearly_salary_us_vs_world
              fieldId: yearly_salary
              tabId: tabs.usa_vs_the_world
              blockType: HorizontalBarBlock2
              hasData: true
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: in
                              value: [USA]
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: nin
                              value: [USA]

      - id: job_title
        template: multiple_options2_freeform
        variants:
            - template: vs_salary
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_age
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_years_of_experience
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_gender
              parameters:
                  limit: 20
                  cutoff: 100
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender

      - id: work_areas
        template: multiple_options2_combined
        variants:
            - template: vs_salary
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_age
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_years_of_experience
              parameters:
                  limit: 20
                  cutoff: 100
                  sort: { property: medianByFacet, order: asc }
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
            - template: vs_gender
              parameters:
                  limit: 20
                  cutoff: 100
              chartOptions:
                  limit: 10
              queryOptions:
                  subField: freeform
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender

      - id: tokyodev_resources
        items: [td-article]
        template: recommended_resources

      - id: gender
        template: multiple_options2
        # takeaway: >
        #     Gender did not correlate with income gaps, but there were notable differences between countries. Canada and the U.S. led the rankings in terms of diversity, while European countries had a higher proportion of male respondents.
        variants:
            - template: vs_salary
              parameters:
                  sort: { property: medianByFacet }
            - id: country_vs_gender
              fieldId: country
              tabId: tabs.by_country
              template: multiple_options2
              parameters:
                  showNoAnswer: true
                  limit: 20
              filtersState:
                  options:
                      mode: facet
                      sort: female
                      order: desc
                  facet:
                      sectionId: user_info
                      id: gender

      - id: user_info_resources_2
        items: [fm-getting-a-job-v3, fm-free]
        template: recommended_resources

