- id: user_info
  titleId: sections.demographics.title
  path: /demographics
  blocks:
      - id: japan_province
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        parameters:
            cutoff: 10
            enableAddMissingBuckets: false
            showNoAnswer: true
            sort: { property: count }
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  cutoff: 10
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  cutoff: 10

      - id: residency_status
        template: tokyodev_multiple_options2_combined
        defaultUnits: percentageQuestion
        blockType: HorizontalBarBlock2
        parameters: { showNoAnswer: true, sort: { property: count } }
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
            # those here less than a year, 1–3 years, and 4 years or more
            - template: tokyodev_variant_base
              id: residency_status_by_years_in_japan
              tabId: tabs.by_years_in_japan
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_under_1
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_1_3
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_4_6
                                  - range_7_9
                                  - range_10_12
                                  - range_13_15
                                  - range_16_20
                                  - range_over_20

      - id: country
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        parameters: { cutoff: 10, limit: 0, showNoAnswer: true, enableAddMissingBuckets: false }
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  cutoff: 10
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  cutoff: 10

      - id: age
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        queryOptions:
            editionsCount: 1
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }
            - template: tokyodev_variant_base
              id: age_by_remote_work_policy
              tabId: tabs.by_remote_work_policy
              parameters:
                  sort: { property: options }
              filtersState:
                  facet:
                      sectionId: job_info
                      id: remote_work_policy

      - id: gender
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type

      - id: identify_as_lgbtq
        template: tokyodev_multiple_options2_combined
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
            - template: tokyodev_variant_base
              id: identify_as_lgbtq_by_gender
              tabId: tabs.by_gender
              filtersState:
                  filters:
                      - year: 2026
                        conditions:
                            - fieldId: gender
                              sectionId: user_info
                              operator: eq
                              value: man
                      - year: 2026
                        conditions:
                            - fieldId: gender
                              sectionId: user_info
                              operator: eq
                              value: woman

      - id: religion
        template: tokyodev_multiple_options2_combined
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
            - id: religion_vs_country
              tabId: tabs.by_country
              template: tokyodev_variant_base
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: eq
                              value: IDN
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: eq
                              value: FRA

      # TODO 2027: re-enable multi-year comparisons
      # which were disabled between 2026 and 2025
      # because of options change
      - id: years_of_experience
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        queryOptions:
            editionsCount: 1
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }

      - id: years_in_japan
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        # TODO 2027: get rid of editionsCount
        # it's only there until next year because options changed between 2025 and 2026 so we can't compare both datasets
        queryOptions:
            editionsCount: 1
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }
            # Japanese ability of those here 3 years or less, 4–9 years, and 10 years or more
            - template: tokyodev_variant_base
              id: years_in_japan_by_japanese_proficiency
              fieldId: language_proficiency_japanese
              i18nNamespace: language_proficiency_japanese
              tabId: tabs.by_japanese_proficiency
              queryOptions:
                  sectionId: user_info
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_under_1
                                  - range_1_3
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_4_6
                                  - range_7_9
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_10_12
                                  - range_13_15
                                  - range_16_20
                                  - range_over_20
            # where those here less than 10 years and 10 years or more lived
            - template: tokyodev_variant_base
              id: years_in_japan_by_japan_province
              fieldId: japan_province
              i18nNamespace: japan_province
              tabId: tabs.by_japanese_province
              queryOptions:
                  sectionId: user_info
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_under_1
                                  - range_1_3
                                  - range_4_6
                                  - range_7_9
                      - conditions:
                            - fieldId: years_in_japan
                              sectionId: user_info
                              operator: in
                              value:
                                  - range_10_12
                                  - range_13_15
                                  - range_16_20
                                  - range_over_20

      - id: professional_qualifications
        template: tokyodev_multiple_options2_combined
        defaultUnits: percentageQuestion
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type

      - id: language_proficiency_english
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        parameters: { showNoAnswer: true, sort: { property: options } }
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }
            # AI impact for native speakers, fluent speakers, and business-level or below
            - template: tokyodev_variant_base
              id: language_proficiency_english_by_ai_impact
              fieldId: ai_impact
              i18nNamespace: ai_impact
              tabId: tabs.by_ai_impact
              queryOptions:
                  sectionId: ai_usage
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: language_proficiency_english
                              sectionId: user_info
                              operator: eq
                              value: native_bilingual
                      - conditions:
                            - fieldId: language_proficiency_english
                              sectionId: user_info
                              operator: eq
                              value: fluent
                      - conditions:
                            - fieldId: language_proficiency_english
                              sectionId: user_info
                              operator: in
                              value:
                                  - none
                                  - basic
                                  - conversational
                                  - business

      - id: language_proficiency_japanese
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        parameters: { showNoAnswer: true, sort: { property: options } }
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }
            # negative aspects of life in Japan for basic or no Japanese vs business-level or better
            - template: tokyodev_variant_base
              id: language_proficiency_japanese_by_negative_aspects
              fieldId: life_japan_negative_aspects
              i18nNamespace: life_japan_negative_aspects
              tabId: tabs.by_negative_aspects
              queryOptions:
                  sectionId: life_in_japan
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: language_proficiency_japanese
                              sectionId: user_info
                              operator: in
                              value:
                                  - none
                                  - basic
                      - conditions:
                            - fieldId: language_proficiency_japanese
                              sectionId: user_info
                              operator: in
                              value:
                                  - business
                                  - fluent
                                  - native_bilingual

      - id: jlpt_level
        template: tokyodev_multiple_options2_combined
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
            # positive aspects of life in Japan for N3 or lower (or no JLPT), N2, and N1
            - template: tokyodev_variant_base
              id: jlpt_level_by_positive_aspects
              fieldId: life_japan_positive_aspects
              i18nNamespace: life_japan_positive_aspects
              tabId: tabs.by_positive_aspects
              queryOptions:
                  sectionId: life_in_japan
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: jlpt_level
                              sectionId: user_info
                              operator: in
                              value:
                                  - none
                                  - n5
                                  - n4
                                  - n3
                      - conditions:
                            - fieldId: jlpt_level
                              sectionId: user_info
                              operator: in
                              value:
                                  - n2
                      - conditions:
                            - fieldId: jlpt_level
                              sectionId: user_info
                              operator: in
                              value:
                                  - n1
            - id: jlpt_level_by_japanese_ability
              tabId: tabs.by_japanese_ability
              template: tokyodev_variant_base
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: language_proficiency_japanese
                              sectionId: user_info
                              operator: eq
                              value: business
                      - conditions:
                            - fieldId: language_proficiency_japanese
                              sectionId: user_info
                              operator: eq
                              value: fluent

      - id: other_japanese_certifications
        template: tokyodev_multiple_options2_combined
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_employer_type

- id: job_info
