              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: residency_status
                              sectionId: user_info
                              operator: eq
                              value: permanent_resident
                      - conditions:
                            - fieldId: residency_status
                              sectionId: user_info
                              operator: eq
                              value: engineer
                      - conditions:
                            - fieldId: residency_status
                              sectionId: user_info
                              operator: eq
                              value: spouse_dependent_japanese_permanent_resident
                      - conditions:
                            - fieldId: residency_status
                              sectionId: user_info
                              operator: eq
                              value: hsfp

