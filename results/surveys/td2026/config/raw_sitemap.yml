              tabId: tabs.by_americans
              template: tokyodev_variant_base
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: eq
                              value: USA
                      - conditions:
                            - fieldId: country
                              sectionId: user_info
                              operator: nin
                              value:
                                  - USA

      - id: life_japan_negative_aspects
        template: tokyodev_multiple_options2_combined
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
