        parameters: { showNoAnswer: true, sort: { property: count } }
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type

      - id: current_employer
        template: tokyodev_multiple_options2_combined
        defaultUnits: percentageQuestion
        variants:
            - template: tokyodev_vs_salary
            - template: tokyodev_vs_experience_vs_salary

      - id: languages_used_colleagues_english
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }

      - id: languages_used_colleagues_japanese
        template: tokyodev_multiple_options2
        defaultUnits: percentageQuestion
        variants:
            - template: tokyodev_vs_salary
              parameters:
                  sort: { property: options }
            - template: tokyodev_vs_experience_vs_salary
            - template: tokyodev_vs_employer_type
              parameters:
                  sort: { property: options }
            - template: tokyodev_variant_base
              id: languages_used_colleagues_japanese_by_remote_work_policy
              tabId: tabs.by_remote_work_policy
              filtersState:
                  facet:
                      sectionId: job_info
                      id: remote_work_policy
            - template: tokyodev_variant_base
              id: languages_used_colleagues_japanese_by_overtime_hours
              tabId: tabs.by_overtime_hours
              # the median is 1–9 hours for every group, so show the full breakdown instead
              chartOptions:
                  defaultView: percentageBucket
              filtersState:
