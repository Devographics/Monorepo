              tabId: tabs.by_job_happiness
              template: tokyodev_variant_base
              parameters:
                  showNoAnswer: false
              filtersState:
                  filters:
                      - conditions:
                            - fieldId: job_happiness
                              sectionId: job_info
                              operator: in
                              # numeric options are passed to the API as value_N enums
                              value:
                                  - value_0
                                  - value_1
                      - conditions:
                            - fieldId: job_happiness
                              sectionId: job_info
                              operator: eq
                              value: value_4

